openapi: 3.0.3
info:
  title: taskdemo Task Tracking API
  version: 1.1.0
  description: HTTP JSON contract for the Task Tracking reference feature with accounts and Bearer authentication.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: HTTP readiness
      security: []
      responses:
        "200":
          description: Process can serve HTTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEmpty"
  /login:
    post:
      summary: Issue an opaque Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessLogin"
        "401":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
  /profile:
    patch:
      summary: Update the caller profile (user role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfile"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAccount"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /accounts:
    post:
      summary: Create an account (admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAccount"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /accounts/{id}/status:
    patch:
      summary: Activate or deactivate an account (admin role)
      parameters:
        - $ref: "#/components/parameters/AccountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAccountStatus"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAccount"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /accounts/{id}:
    delete:
      summary: Soft-delete an account (admin role)
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEmpty"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      summary: Create a task (user role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessTask"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /tasks/{id}:
    get:
      summary: Get task details
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessTask"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tasks/{id}/start:
    post:
      summary: Start a task
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessTask"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /tasks/{id}/complete:
    post:
      summary: Complete a task
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessTask"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /tasks/{id}/due-date:
    patch:
      summary: Reschedule or clear a due date
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleTask"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessTask"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    TaskID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Login:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CreateAccount:
      type: object
      additionalProperties: false
      required: [email, name, password, role]
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, user]
    SetAccountStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, non_active]
    UpdateProfile:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        password:
          type: string
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, non_active]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
        dueDate:
          type: string
          format: date-time
          nullable: true
    RescheduleTask:
      type: object
      additionalProperties: false
      required: [dueDate]
      properties:
        dueDate:
          type: string
          format: date-time
          nullable: true
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        dueDate:
          type: string
          format: date-time
          nullable: true
        overdue:
          type: boolean
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    SuccessLogin:
      type: object
      required: [status, data]
      properties:
        status:
          const: success
        data:
          type: object
          required: [token, tokenType]
          properties:
            token:
              type: string
            tokenType:
              const: Bearer
    SuccessAccount:
      type: object
      required: [status, data]
      properties:
        status:
          const: success
        data:
          $ref: "#/components/schemas/Account"
    SuccessTask:
      type: object
      required: [status, data]
      properties:
        status:
          const: success
        data:
          $ref: "#/components/schemas/Task"
    SuccessEmpty:
      type: object
      required: [status, data]
      properties:
        status:
          const: success
        data:
          type: object
    ErrorEnvelope:
      type: object
      required: [status, data, error]
      properties:
        status:
          const: error
        data:
          type: object
        error:
          type: object
          required: [message, code, errors]
          properties:
            message:
              type: string
            code:
              type: string
            errors:
              type: array
              items:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
security:
  - bearerAuth: []
